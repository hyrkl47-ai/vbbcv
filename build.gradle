buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.vanta.core'
    compileSdk 33
    defaultConfig {
        applicationId "com.vanta.core"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }
}
